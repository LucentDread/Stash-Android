name: Publish releases

# Creates the missing tags and releases (see scripts/publish-releases.sh)
# whenever main changes, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: publish-releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The APK of the current version, built and signed here when its
      # release has none yet. The signing key comes from the repository
      # secrets (see README "Signing"); without them, nothing is built.
      - name: Check whether an APK is needed
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -z "$KEYSTORE" ]]; then
            echo "::warning::No signing key in the secrets: no APK built."
            exit 0
          fi
          count=$(gh release view "v$version" --json assets \
            -q '[.assets[].name | select(endswith(".apk"))] | length' 2> /dev/null || echo 0)
          if [[ "$count" == 0 ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$version already has its APK."
          fi

      - uses: actions/setup-java@v4
        if: steps.need.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        if: steps.need.outputs.build == 'true'
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Build the signed universal APK
        if: steps.need.outputs.build == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.need.outputs.version }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > android/stash-release.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-stash}"
            echo "storeFile=../stash-release.jks"
          } > android/key.properties
          # One APK for every device: 32- and 64-bit ARM (phones, most
          # TVs) and x86_64.
          flutter build apk --release
          rm android/stash-release.jks android/key.properties
          apk=build/app/outputs/flutter-apk/app-release.apk
          # Only the release key may sign it: with another one (or the
          # debug key, if the secrets were wrong), installed apps could not
          # update.
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$signer" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "SHA-256 digest: 2936c83b7f7790dc83d02065f25123d9eb32f7569c2f887abae221df8ef5543f" \
            "$RUNNER_TEMP/certs.txt"
          mkdir -p "$RUNNER_TEMP/apks"
          cp "$apk" "$RUNNER_TEMP/apks/Stash-$VERSION.apk"

      # Signed APKs can also be handed over on a temporary "release-apks"
      # branch (one Stash-X.Y.Z.apk per version); it is removed once used.
      - name: Fetch the APKs
        id: apks
        run: |
          if git ls-remote --exit-code --heads origin release-apks > /dev/null; then
            git fetch --quiet origin release-apks
            mkdir -p "$RUNNER_TEMP/apks"
            git archive origin/release-apks | tar -x -C "$RUNNER_TEMP/apks"
            echo "branch=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -d "$RUNNER_TEMP/apks" ]]; then
            ls "$RUNNER_TEMP/apks"
            echo "dir=$RUNNER_TEMP/apks" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
          APKS: ${{ steps.apks.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-releases.sh ${APKS:+--apks "$APKS"}

      - name: Delete the temporary APK branch
        if: steps.apks.outputs.branch == 'true'
        run: git push origin --delete release-apks
